[package]
name = "daily-routine-desktop"
version = "0.1.0"
description = "A calm daily routine and task planner for Windows"
authors = ["Daily Routine"]
edition = "2021"

[lib]
name = "daily_routine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
